# Memory and JVM settings
org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options="-Xmx4096M"

# Android flags
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=true

# Suppress AGP 9 warnings for deprecated options above
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
